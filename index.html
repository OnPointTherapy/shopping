<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shopping">
<title>Shopping List</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=DM+Sans:wght@300;400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#1D9E75;--teal-light:#E1F5EE;--teal-dark:#085041;--teal-mid:#0F6E56;
  --bg:#F5F3EE;--white:#FFFFFF;--ink:#1E1D1A;--ink-mid:#6B6A65;--ink-soft:#A8A7A2;
  --border:rgba(0,0,0,0.08);--border-mid:rgba(0,0,0,0.14);
  --radius:14px;--radius-sm:10px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg);font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior:none;}

/* Header */
.header{position:fixed;top:0;left:0;right:0;z-index:50;padding:calc(var(--safe-top) + 14px) 18px 12px;background:rgba(245,243,238,0.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--border);}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.header-title{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:500;letter-spacing:-0.3px;}
.header-title span{color:var(--teal);}
.meal-names{font-size:11px;color:var(--ink-mid);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}
.progress-row{display:flex;align-items:center;gap:10px;}
.progress-bar-wrap{flex:1;height:5px;background:var(--border-mid);border-radius:99px;overflow:hidden;}
.progress-bar{height:100%;background:var(--teal);border-radius:99px;transition:width 0.4s cubic-bezier(0.34,1.56,0.64,1);}
.progress-label{font-size:12px;color:var(--ink-mid);white-space:nowrap;min-width:48px;text-align:right;}

/* Welcome screen */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2.5rem 1.5rem;text-align:center;}
.welcome-icon{font-size:56px;margin-bottom:20px;}
.welcome-title{font-family:'Fraunces',Georgia,serif;font-size:26px;font-weight:500;margin-bottom:10px;letter-spacing:-0.3px;}
.welcome-sub{font-size:14px;color:var(--ink-mid);line-height:1.65;margin-bottom:32px;max-width:300px;}
.welcome-btn{width:100%;max-width:300px;padding:17px 20px;border-radius:var(--radius);border:none;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;}
.btn-primary-full{background:var(--teal);color:var(--white);}
.btn-outline-full{background:transparent;color:var(--teal);border:1.5px solid var(--teal) !important;}
.welcome-hint{font-size:12px;color:var(--ink-soft);margin-top:20px;line-height:1.6;max-width:280px;}
.welcome-steps{text-align:left;background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;max-width:300px;width:100%;margin-bottom:24px;}
.welcome-steps h3{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);margin-bottom:10px;}
.step{display:flex;gap:10px;margin-bottom:8px;font-size:13px;color:var(--ink-mid);line-height:1.4;}
.step-num{background:var(--teal);color:white;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;margin-top:1px;}

/* Scroll area */
.scroll-area{padding-top:150px;padding-bottom:calc(var(--safe-bot) + 86px);}

/* Section */
.section{margin-bottom:4px;}
.section-header{display:flex;align-items:center;gap:10px;padding:14px 18px 8px;position:sticky;top:138px;z-index:10;background:rgba(245,243,238,0.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.section-emoji{font-size:17px;line-height:1;}
.section-name{font-size:11px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-mid);flex:1;}
.section-count{font-size:12px;color:var(--ink-soft);background:rgba(0,0,0,0.06);padding:2px 8px;border-radius:20px;}
.section-done .section-name,.section-done .section-emoji{opacity:0.45;}

.items-list{padding:0 12px;display:flex;flex-direction:column;gap:4px;}

/* Item */
.item{display:flex;align-items:center;gap:14px;padding:15px 16px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity 0.2s;user-select:none;}
.item:active{opacity:0.7;}
.item.ticked{opacity:0.35;}
.item.ticked .item-name{text-decoration:line-through;}
.tick-circle{width:27px;height:27px;flex-shrink:0;border-radius:50%;border:1.5px solid var(--border-mid);display:flex;align-items:center;justify-content:center;transition:all 0.18s;background:var(--white);}
.item.ticked .tick-circle{background:var(--teal);border-color:var(--teal);}
.tick-check{opacity:0;transform:scale(0.4);transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1);font-size:13px;color:white;font-weight:700;}
.item.ticked .tick-check{opacity:1;transform:scale(1);}
.item-name{font-size:15px;flex:1;line-height:1.3;color:var(--ink);}
.item-badge{font-size:10px;color:var(--ink-soft);background:var(--bg);padding:2px 7px;border-radius:20px;flex-shrink:0;}

/* Bottom bar */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;padding:10px 14px calc(var(--safe-bot) + 10px);background:rgba(245,243,238,0.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;gap:8px;}
.bottom-btn{flex:1;padding:14px 10px;border-radius:var(--radius-sm);border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;}
.btn-ghost{background:var(--white);color:var(--ink-mid);border:1px solid var(--border-mid);}
.btn-teal{background:var(--teal);color:var(--white);}

/* All done */
.all-done{text-align:center;padding:4rem 2rem;}
.all-done-icon{font-size:52px;margin-bottom:14px;}
.all-done-title{font-family:'Fraunces',Georgia,serif;font-size:24px;font-weight:500;color:var(--teal-dark);margin-bottom:8px;}
.all-done-sub{font-size:14px;color:var(--ink-mid);}

/* Hint */
@keyframes fadeout{0%{opacity:0.8}60%{opacity:0.8}100%{opacity:0}}
.swipe-hint{text-align:center;font-size:12px;color:var(--ink-soft);padding:12px;animation:fadeout 4s ease forwards;}

/* Loading */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;font-size:14px;color:var(--ink-mid);}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:28px;height:28px;border:2px solid var(--border-mid);border-top-color:var(--teal);border-radius:50%;animation:spin 0.8s linear infinite;}

/* Search */
.search-wrap{position:relative;margin-top:10px;}
.search-input{width:100%;padding:9px 36px 9px 14px;border:1px solid var(--border-mid);border-radius:var(--radius-sm);background:var(--white);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px;-webkit-appearance:none;appearance:none;}
.search-input:focus{outline:none;border-color:var(--teal);}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:16px;color:var(--ink-soft);cursor:pointer;padding:4px;line-height:1;display:none;}
.search-back-bar{display:none;margin-top:8px;}
.search-back-btn{width:100%;padding:10px;border-radius:var(--radius-sm);border:1.5px solid var(--teal);background:var(--teal-light);color:var(--teal-dark);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;gap:6px;}
.search-back-btn:active{opacity:0.7;}
.search-results{padding:0 12px 8px;}
.search-result-item{display:flex;align-items:center;gap:14px;padding:15px 16px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;margin-bottom:4px;}
.search-result-item:active{opacity:0.7;}
.search-result-item.ticked{opacity:0.35;}
.search-result-item.ticked .item-name{text-decoration:line-through;}
.search-result-item .tick-circle{width:27px;height:27px;flex-shrink:0;border-radius:50%;border:1.5px solid var(--border-mid);display:flex;align-items:center;justify-content:center;transition:all 0.18s;background:var(--white);}
.search-result-item.ticked .tick-circle{background:var(--teal);border-color:var(--teal);}
.search-result-item .tick-check{opacity:0;transform:scale(0.4);transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1);font-size:13px;color:white;font-weight:700;}
.search-result-item.ticked .tick-check{opacity:1;transform:scale(1);}
.search-aisle-label{font-size:10px;color:var(--ink-soft);background:var(--bg);padding:2px 7px;border-radius:20px;flex-shrink:0;margin-left:auto;}
.search-empty{text-align:center;padding:2rem;color:var(--ink-soft);font-size:14px;}
.search-count{font-size:12px;color:var(--ink-soft);padding:6px 12px 4px;}
/* Collapsible sections */
.section-header{cursor:pointer;}
.section-toggle{font-size:11px;color:var(--ink-soft);margin-left:4px;transition:transform 0.2s;}
.section.collapsed .section-toggle{transform:rotate(-90deg);}
.section.collapsed .items-list{display:none;}
.section-done-pill{font-size:10px;font-weight:500;background:var(--teal-light);color:var(--teal-dark);padding:2px 8px;border-radius:20px;margin-left:4px;}
</style>
</head>
<body>

<div id="root"></div>

<script>
const AISLES = [
  {key:'Alcohol',             label:'Alcohol',                  emoji:'🍷'},
  {key:'Produce',             label:'Fruit & Vegetables',       emoji:'🥦'},
  {key:'Bakery & Bread',      label:'Bakery',                   emoji:'🍞'},
  {key:'Dairy & Eggs',        label:'Dairy & Eggs',             emoji:'🥛'},
  {key:'Sauces & Condiments', label:'Sauces & Condiments',      emoji:'🫙'},
  {key:'Pantry',              label:'Pantry',                   emoji:'🥫'},
  {key:'Spices',              label:'Spices & Herbs',           emoji:'🌶️'},
  {key:'Household',           label:'Household & Cleaning',     emoji:'🧹'},
  {key:'Meat & Seafood',      label:'Refrigerated — Meat & Seafood', emoji:'🥩'},
  {key:'Refrigerated',        label:'Refrigerated — Other',     emoji:'❄️'},
  {key:'Other',               label:'Refrigerated — General',   emoji:'🧊'},
  {key:'Frozen',              label:'Frozen Goods',             emoji:'🧊'},
];

const CAT_NORM = {
  'Meat & Seafood':'Meat & Seafood','Produce':'Produce','Dairy & Eggs':'Dairy & Eggs',
  'Pantry':'Pantry','Sauces & Condiments':'Sauces & Condiments','Bakery & Bread':'Bakery & Bread',
  'Frozen':'Frozen','Household':'Household','Other':'Other','Alcohol':'Alcohol',
  'Spices':'Spices','Refrigerated':'Refrigerated',
  // Short codes from compact URL encoding
  'MS':'Meat & Seafood','PR':'Produce','DE':'Dairy & Eggs','PA':'Pantry',
  'SC':'Sauces & Condiments','BB':'Bakery & Bread','FR':'Frozen',
  'HH':'Household','OT':'Other','AL':'Alcohol','SP':'Spices','RF':'Refrigerated',
};

let APP = { items:[], ticked:new Set(), mealNames:[], loaded:false };

// ── URL data handling ──────────────────────────────
function baseIngredientName(name) {
  const DESCRIPTORS = 'a|an|the|some|few|large|small|medium|fresh|dried|frozen|tinned|canned|cooked|raw|whole|baby|mini|extra|ripe|green|red|yellow|white|black|brown|dark|light|sweet|plain|pure|organic|chopped|diced|sliced|grated|minced|crushed|peeled|halved|quartered|roughly|finely';
  const UNITS = 'g|kg|ml|l|x|pack|packs|can|cans|bunch|bunches|head|heads|clove|cloves|cup|cups|tbsp|tsp|slice|slices|piece|pieces|sprig|sprigs|stalk|stalks|rasher|rashers|fillet|fillets|bottle|bottles|jar|jars|bag|bags|tin|tins|loaf|loaves|block|blocks|punnet|punnets|dozen|litre|litres|lb|oz|knob|splash|pinch|handful|bulb|bulbs|stick|sticks';
  const TRAILING = 'cloves|clove|bulb|bulbs|bunch|bunches|head|heads|stalk|stalks|stick|sticks|leaves|leaf|sprig|sprigs|rasher|rashers|fillet|fillets|piece|pieces|slice|slices|cube|cubes|strip|strips|floret|florets';
  let s = name.toLowerCase();
  s = s.replace(/\(.*?\)/g, '');
  s = s.replace(new RegExp('\\d+\\s*(' + UNITS + ')\\b', 'gi'), '');
  s = s.replace(/^\d+\s*/, '');
  s = s.replace(new RegExp('\\b(' + DESCRIPTORS + ')\\b\\s*', 'gi'), '');
  s = s.replace(/[^a-z0-9\s&]/g, '').replace(/\s+/g, ' ').trim();
  s = s.replace(new RegExp('\\s+(' + TRAILING + ')$', 'i'), '').trim();
  const irregulars = [['tomatoes','tomato'],['potatoes','potato'],['avocados','avocado'],['mangoes','mango'],['leaves','leaf'],['halves','half']];
  irregulars.forEach(([pl,sg]) => { s = s.replace(new RegExp('\\b' + pl + '\\b', 'g'), sg); });
  s = s.replace(/\b([a-z]{3,})s\b/g, '$1');
  return s.replace(/\s+/g, ' ').trim();
}

function tryLoadFromURL() {
  try {
    const params = new URLSearchParams(window.location.search);
    const d = params.get('d');
    if (!d) return false;
    const json = atob(d);
    const data = JSON.parse(json);
    // Handle compact format {items, mealNames} sent from meal planner
    if (data.i || data.items) {
      initFromCompact(data);
    } else {
      // Legacy: full data file loaded via URL (unlikely but handle gracefully)
      initFromFull(data);
    }
    window.history.replaceState({}, '', window.location.pathname);
    return true;
  } catch(e) { console.warn('URL load failed:', e); return false; }
}

// Compact format from "Send to phone" button — already a flat list
function initFromCompact(data) {
  const norm = c => CAT_NORM[c] || 'Other';
  const srcMap = {'r':'recipe','st':'staple','o':'one-off'};
  const rawItems = (data.i || data.items || []).map(i => ({
    name: i.n, cat: norm(i.c || 'OT'), source: srcMap[i.s] || i.s || 'recipe'
  }));
  APP.items = mergeItems(rawItems);
  APP.ticked = new Set();
  APP.mealNames = data.m || data.mealNames || [];
  APP.loaded = true;
  render();
}

// Merge items by base ingredient key
function mergeItems(items) {
  const merged = new Map();
  items.forEach(item => {
    const base = baseIngredientName(item.name);
    if (!base) return;
    if (merged.has(base)) {
      const existing = merged.get(base);
      existing.count = (existing.count || 1) + 1;
      const newQty = item.name.match(/\(\s*([\d.]+)\s*([^)\d]*)\)/);
      const exQty  = existing.rawName.match(/\(\s*([\d.]+)\s*([^)\d]*)\)/);
      if (newQty && exQty) {
        const q1 = parseFloat(exQty[1]), q2 = parseFloat(newQty[1]);
        const unit = (exQty[2] || newQty[2] || '').trim();
        if (!isNaN(q1) && !isNaN(q2)) {
          const basePart = existing.rawName.replace(/\s*\(.*?\)\s*$/, '').trim();
          existing.name = basePart + ' (' + (q1 + q2) + (unit ? ' ' + unit : '') + ')';
        }
      } else if (!newQty && !exQty && existing.count > 1) {
        existing.name = existing.rawName + ' (x' + existing.count + ')';
      }
      if (existing.cat === 'Other' && item.cat !== 'Other') existing.cat = item.cat;
    } else {
      merged.set(base, { name: item.name, rawName: item.name, cat: item.cat, source: item.source, count: 1 });
    }
  });
  return [...merged.values()];
}

// Full format from .json file import
function initFromFull(data) {
  const norm = c => CAT_NORM[c] || 'Other';
  const raw = [];

  (data.selectedMeals || []).forEach(id => {
    const r = (data.recipes || []).find(x => x.id === id);
    if (!r) return;
    r.ingredients.forEach(ingr => raw.push({name:ingr.name, cat:norm(ingr.cat||'Other'), source:'recipe'}));
  });
  (data.addedStaples || []).forEach(id => {
    const s = (data.staples || []).find(x => x.id === id);
    if (s) raw.push({name:s.name, cat:norm(s.cat||'Other'), source:'staple'});
  });
  (data.oneOffItems || []).forEach(i => raw.push({name:i.name, cat:norm(i.cat||'Other'), source:'one-off'}));

  APP.items = mergeItems(raw);
  APP.ticked = new Set();
  APP.mealNames = (data.selectedMeals || [])
    .map(id => (data.recipes || []).find(r => r.id === id)?.name)
    .filter(Boolean);
  APP.loaded = true;
  render();
}

function initApp(data) { initFromFull(data); }

// ── File import ────────────────────────────────────
function triggerFileLoad() {
  let inp = document.getElementById('file-inp');
  if (!inp) {
    inp = document.createElement('input');
    inp.type = 'file'; inp.id = 'file-inp'; inp.accept = '.json';
    inp.style.display = 'none';
    inp.onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = ev => {
        try {
          const data = JSON.parse(ev.target.result);
          if (!data.recipes) throw new Error();
          initApp(data);
        } catch { alert('Could not read that file. Make sure it\'s exported from the meal planner.'); }
      };
      r.readAsText(f);
      inp.value = '';
    };
    document.body.appendChild(inp);
  }
  inp.click();
}

// ── Toggle ─────────────────────────────────────────
function toggleItem(key) {
  APP.ticked.has(key) ? APP.ticked.delete(key) : APP.ticked.add(key);
  if (navigator.vibrate) navigator.vibrate(6);
  renderHeader();
  if (APP_SEARCH) renderSearchResults();
  else renderList();
}

function resetTicks() { APP.ticked.clear(); renderList(); }

// ── Render ─────────────────────────────────────────
function render() {
  if (!APP.loaded) { renderWelcome(); return; }
  renderHeader();
  renderList();
  renderBottomBar();
}

function renderWelcome() {
  document.getElementById('root').innerHTML = `
    <div class="welcome">
      <div class="welcome-icon">🛒</div>
      <div class="welcome-title">On Point <span style="color:var(--teal)">Shop</span></div>
      <div class="welcome-sub">Your iPhone-friendly shopping companion. Load your list from the meal planner to get started.</div>
      <div class="welcome-steps">
        <h3>How to load your list</h3>
        <div class="step"><div class="step-num">1</div><span>On your Mac, open the meal planner and plan your week</span></div>
        <div class="step"><div class="step-num">2</div><span>Tap <strong>📱 Send to phone</strong> — it copies a link to your clipboard</span></div>
        <div class="step"><div class="step-num">3</div><span>Paste that link into Safari on your iPhone — your list loads instantly</span></div>
      </div>
      <button class="welcome-btn btn-outline-full" onclick="triggerFileLoad()">📂 Or load a .json file</button>
      <button class="welcome-btn btn-primary-full" onclick="loadDemo()">✨ Try a sample list</button>
      <div class="welcome-hint">Bookmark this page in Safari after loading your list, then use <em>Add to Home Screen</em> for one-tap access next time.</div>
    </div>`;
}

let APP_SEARCH = '';
let collapsedSections = new Set(); // tracks manually collapsed section keys

function handleSearch(val) {
  APP_SEARCH = val.trim().toLowerCase();
  const clearBtn = document.getElementById('search-clear');
  if (clearBtn) clearBtn.style.display = APP_SEARCH ? 'block' : 'none';
  renderSearchOrList();
}

function clearSearch() {
  APP_SEARCH = '';
  const inp = document.getElementById('search-input');
  if (inp) inp.value = '';
  const clearBtn = document.getElementById('search-clear');
  if (clearBtn) clearBtn.style.display = 'none';
  renderSearchOrList();
}

function renderSearchOrList() {
  if (APP_SEARCH) renderSearchResults();
  else renderList();
}

function renderSearchResults() {
  let area = document.querySelector('.scroll-area');
  if (!area) return;

  const matches = APP.items.filter(item =>
    item.name.toLowerCase().includes(APP_SEARCH)
  );

  if (!matches.length) {
    area.innerHTML = '<div class="search-empty">No items matching "' + APP_SEARCH + '"</div>';
    return;
  }

  // Find which aisle each match belongs to
  const aisleMap = {};
  AISLES.forEach(a => aisleMap[a.key] = a);

  let html = '<div class="search-count">' + matches.length + ' result' + (matches.length !== 1 ? 's' : '') + '</div>' +
    '<div class="search-results">';

  matches.forEach(item => {
    const baseKey = baseIngredientName(item.name) || item.name.toLowerCase();
    const checked = APP.ticked.has(baseKey);
    const safeKey = baseKey.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    const aisle = aisleMap[item.cat] || aisleMap['Other'];
    html += '<div class="search-result-item' + (checked ? ' ticked' : '') + '" onclick="toggleItemAndRefreshSearch(\'' + safeKey + '\')">' +
      '<div class="tick-circle"><span class="tick-check">✓</span></div>' +
      '<span class="item-name" style="flex:1">' + item.name + '</span>' +
      '<span class="search-aisle-label">' + (aisle ? aisle.emoji + ' ' + aisle.label : item.cat) + '</span>' +
    '</div>';
  });

  html += '</div>';
  area.innerHTML = html;
}

function toggleItemAndRefreshSearch(baseKey) {
  APP.ticked.has(baseKey) ? APP.ticked.delete(baseKey) : APP.ticked.add(baseKey);
  if (navigator.vibrate) navigator.vibrate(6);
  renderHeader();
  if (APP_SEARCH) renderSearchResults();
  else renderList();
}

function toggleSection(key) {
  if (collapsedSections.has(key)) collapsedSections.delete(key);
  else collapsedSections.add(key);
  // Toggle in DOM without full re-render for smoothness
  const id = 'section-' + key.replace(/[^a-z0-9]/gi,'-');
  const el = document.getElementById(id);
  if (el) {
    el.classList.toggle('collapsed');
    // If a done section was manually expanded, remove auto-collapse
    if (!el.classList.contains('collapsed') && el.classList.contains('section-done')) {
      // keep it open — user explicitly expanded it
    }
  }
}

function renderHeader() {
  const total = APP.items.length;
  const done = [...APP.ticked].length;
  const pct = total > 0 ? Math.round((done/total)*100) : 0;
  const names = APP.mealNames.slice(0,2).join(', ') + (APP.mealNames.length > 2 ? ' +' + (APP.mealNames.length-2) + ' more' : '');

  const existing = document.querySelector('.header');
  const html = '<header class="header">' +
    '<div class="header-top">' +
      '<div>' +
        '<div class="header-title">On Point <span>Shop</span></div>' +
        (names ? '<div class="meal-names">' + names + '</div>' : '') +
      '</div>' +
      '<div style="font-size:13px;color:var(--ink-mid);font-weight:500">' + pct + '%</div>' +
    '</div>' +
    '<div class="progress-row">' +
      '<div class="progress-bar-wrap"><div class="progress-bar" style="width:' + pct + '%"></div></div>' +
      '<div class="progress-label">' + done + ' / ' + total + '</div>' +
    '</div>' +
    '<div class="search-wrap">' +
      '<input class="search-input" id="search-input" type="search" placeholder="🔍  search items…" ' +
        'oninput="handleSearch(this.value)" autocomplete="off" autocorrect="off" autocapitalize="off" ' +
        'spellcheck="false" value="' + (APP_SEARCH || '') + '">' +
      '<button class="search-clear" id="search-clear" onclick="clearSearch()" style="display:' + (APP_SEARCH ? 'block' : 'none') + '">✕</button>' +
    '</div>' +
    '<div class="search-back-bar" id="search-back-bar" style="display:' + (APP_SEARCH ? 'block' : 'none') + '">' +
      '<button class="search-back-btn" onclick="clearSearch()">← back to full list</button>' +
    '</div>' +
  '</header>';

  if (existing) existing.outerHTML = html;
  else document.getElementById('root').insertAdjacentHTML('afterbegin', html);
}

function renderList() {
  renderHeader();
  const total = APP.items.length;
  const done = APP.items.filter(i => APP.ticked.has(i.name.toLowerCase())).length;
  let area = document.querySelector('.scroll-area');

  if (!area) {
    const root = document.getElementById('root');
    root.innerHTML = '';
    renderHeader();
    root.insertAdjacentHTML('beforeend', '<div class="scroll-area"></div>');
    renderBottomBar();
    area = document.querySelector('.scroll-area');
  }

  if (total === 0) {
    area.innerHTML = '<div style="text-align:center;padding:4rem 2rem;color:var(--ink-soft);font-size:14px">No items on this list.</div>';
    return;
  }

  if (done === total) {
    area.innerHTML = `<div class="all-done">
      <div class="all-done-icon">🎉</div>
      <div class="all-done-title">All done!</div>
      <div class="all-done-sub">Everything's in the trolley.</div>
    </div>`;
    return;
  }

  // Group by aisle
  const grouped = {};
  AISLES.forEach(a => grouped[a.key] = []);
  APP.items.forEach(item => {
    if (grouped[item.cat]) grouped[item.cat].push(item);
    else grouped['Other'].push(item);
  });

  // Scroll position
  const scrollY = area.scrollTop;

  let html = '<div class="swipe-hint">Tap items to tick them off</div>';
  AISLES.forEach(aisle => {
    const aisleItems = grouped[aisle.key];
    if (!aisleItems || !aisleItems.length) return;
    const tickedCount = aisleItems.filter(i => APP.ticked.has(baseIngredientName(i.name)||i.name.toLowerCase())).length;
    const allDone = tickedCount === aisleItems.length;
    // Auto-collapse completed sections; respect manual toggle
    const isCollapsed = allDone || collapsedSections.has(aisle.key);
    const sectionClass = 'section' + (allDone ? ' section-done' : '') + (isCollapsed ? ' collapsed' : '');
    html += '<div class="' + sectionClass + '" id="section-' + aisle.key.replace(/[^a-z0-9]/gi,'-') + '">' +
      '<div class="section-header" onclick="toggleSection(\'' + aisle.key + '\')">' +
        '<span class="section-emoji">' + aisle.emoji + '</span>' +
        '<span class="section-name">' + aisle.label + '</span>' +
        (allDone ? '<span class="section-done-pill">✓ done</span>' : '<span class="section-count">' + tickedCount + '/' + aisleItems.length + '</span>') +
        '<span class="section-toggle">▾</span>' +
      '</div>' +
      '<div class="items-list">';
    // Sort: unchecked first (alphabetical), then checked (alphabetical) at bottom
    const sorted = [...aisleItems].sort((a, b) => {
      const aKey = baseIngredientName(a.name) || a.name.toLowerCase();
      const bKey = baseIngredientName(b.name) || b.name.toLowerCase();
      const aTicked = APP.ticked.has(aKey);
      const bTicked = APP.ticked.has(bKey);
      if (aTicked !== bTicked) return aTicked ? 1 : -1;
      return a.name.localeCompare(b.name);
    });
    sorted.forEach(item => {
      const baseKey = baseIngredientName(item.name) || item.name.toLowerCase();
      const checked = APP.ticked.has(baseKey);
      const safeKey = baseKey.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      const badge = item.source !== 'recipe' ? '<span class="item-badge">' + item.source + '</span>' : '';
      html += '<div class="item' + (checked?' ticked':'') + '" onclick="toggleItem(\'' + safeKey + '\')">' +
        '<div class="tick-circle"><span class="tick-check">✓</span></div>' +
        '<span class="item-name">' + item.name + '</span>' + badge +
      '</div>';
    });
    html += '</div></div>';
  });

  area.innerHTML = html;
  area.scrollTop = scrollY;
}

function renderBottomBar() {
  const existing = document.querySelector('.bottom-bar');
  const html = `<div class="bottom-bar">
    <button class="bottom-btn btn-ghost" onclick="resetTicks()">↺ uncheck all</button>
    <button class="bottom-btn btn-ghost" onclick="triggerFileLoad()">📂 load list</button>
    <button class="bottom-btn btn-teal" onclick="loadDemo()">sample</button>
  </div>`;
  if (existing) existing.outerHTML = html;
  else document.getElementById('root').insertAdjacentHTML('beforeend', html);
}
